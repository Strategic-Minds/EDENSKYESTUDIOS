name: Eden Skye OS Bridge Runner

# Non-canonical, manual-only scaffold validation. Eden Prime's existing X1
# mission owns recurring execution; this workflow must never schedule itself,
# commit generated files, activate databases, or deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate scaffold report in ephemeral runner (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          rm -f docs/eden_skye_os/BUILD_AND_VALIDATION_PASS_RESULT.md
          node scripts/eden-skye-os-build-and-validation-pass.mjs > "$RUNNER_TEMP/eden-bridge-generator.json"

      - name: Verify fresh report and generator dry-run declaration
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/eden_skye_os/BUILD_AND_VALIDATION_PASS_RESULT.md
          test -s "$RUNNER_TEMP/eden-bridge-generator.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const payload = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'eden-bridge-generator.json'), 'utf8'));
          const report = readFileSync('docs/eden_skye_os/BUILD_AND_VALIDATION_PASS_RESULT.md', 'utf8');
          if (payload?.status !== 'complete' || payload?.live_mutation !== false) throw new Error('Generator did not declare a successful dry run');
          if (!report.startsWith('# EDEN SKYE OS Build And Validation Pass Result')) throw new Error('Incorrect report');
          if (!/^## Live Mutation\r?\nfalse(?:\r?\n|$)/m.test(report)) throw new Error('Report did not declare live mutation false');
          console.log('Fresh local scaffold report validated; not a provider or production-readiness receipt.');
          NODE

      - name: Preserve report as review artifact (not a provider receipt)
        uses: actions/upload-artifact@v4
        with:
          name: eden-bridge-manual-scaffold-report
          path: docs/eden_skye_os/BUILD_AND_VALIDATION_PASS_RESULT.md
          if-no-files-found: error
