name: Eden Skye OS Bridge Runner

# Non-canonical, manual-only scaffold validation. Eden Prime's existing X1
# mission owns recurring execution; this workflow must never schedule itself
# or commit generated files directly to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge-runner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate local scaffold and validation report (no deployment)
        run: node scripts/eden-skye-os-build-and-validation-pass.mjs

      - name: Require a locally generated validation report
        shell: bash
        run: |
          set -euo pipefail
          test -s docs/eden_skye_os/BUILD_AND_VALIDATION_PASS_RESULT.md
          grep -Fq '## Live Mutation' docs/eden_skye_os/BUILD_AND_VALIDATION_PASS_RESULT.md
          grep -Fxq 'false' docs/eden_skye_os/BUILD_AND_VALIDATION_PASS_RESULT.md
          echo 'Scaffold report present. No live readiness or deployment asserted.'

      - name: Preserve report as review artifact (not a provider receipt)
        uses: actions/upload-artifact@v4
        with:
          name: eden-bridge-manual-scaffold-report
          path: docs/eden_skye_os/BUILD_AND_VALIDATION_PASS_RESULT.md
          if-no-files-found: error
